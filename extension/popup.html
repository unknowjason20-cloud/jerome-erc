<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 420px; font-family: sans-serif; font-size: 13px; margin: 10px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button { padding: 5px 10px; cursor: pointer; }
  #count { color: #555; margin-bottom: 8px; }
  .entry { border-top: 1px solid #ddd; padding: 6px 0; word-break: break-all; }
  .rpcids { font-weight: bold; }
  .url { color: #555; font-size: 12px; }
  .time { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h1>Flow Capture Observer</h1>
<div class="row">
  <button id="download">Download log (JSON)</button>
  <button id="clear">Clear</button>
  <button id="refresh">Refresh</button>
</div>
<div id="count"></div>
<div id="list"></div>
<script src="popup.js"></script>
</body>
</html>
